name: CI Runner

on:
  push:
    branches:
      - "*"
  schedule:
    - cron:  '00 10 * * 1'   # once a week on a monday

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      # Make every `uv run` (including those inside make targets) use the
      # matrix interpreter instead of the repo's .python-version.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - name: Install dependencies
        run: uv sync --dev --locked
      - name: Check linting
        run: |
          make ci-lint
      - name: Check tests
        run: |
          make ci-test
        env:
          OPENAI_API_KEY: ""
          HUGGINGFACE_API_KEY: ""
          PYTEST_CURRENT_TEST: "true"
