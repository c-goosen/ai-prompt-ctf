name: CI Runner

on:
  push:
    branches:
      - "*"
  schedule:
    - cron:  '00 10 * * 1'   # once a week on a monday

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      # Make every `uv run` (including those inside make targets) use the
      # matrix interpreter instead of the repo's .python-version.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - name: Install dependencies
        run: uv sync --dev --locked
      - name: Check linting
        run: |
          make ci-lint
      - name: Check tests
        run: |
          make ci-test
        env:
          OPENAI_API_KEY: ""
          HUGGINGFACE_API_KEY: ""
          PYTEST_CURRENT_TEST: "true"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build (vinext, Node standalone)
        run: pnpm build
      - name: Build (Next.js 16.4 compatibility)
        run: pnpm build:next
