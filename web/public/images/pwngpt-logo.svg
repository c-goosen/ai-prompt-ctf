<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" role="img" aria-label="PwnGPT: Agent Hunger Games">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0937"/>
      <stop offset="1" stop-color="#060019"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- mark -->
  <g transform="translate(6 10)">
    <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#5c24ff" stroke-opacity=".5"/>
    <g filter="url(#glow)">
      <path d="M10 58V34C10 19 20 8 32 8s22 11 22 26v24" fill="none" stroke="#ff2fd5" stroke-width="5" stroke-linecap="round"/>
      <rect x="18" y="22" width="28" height="30" rx="9" fill="#060019" stroke="#3cfcd1" stroke-width="3.5"/>
      <circle cx="26" cy="33" r="3" fill="#3cfcd1"/>
      <circle cx="38" cy="33" r="3" fill="#3cfcd1"/>
      <path d="M25 41q7 6 14 0" fill="none" stroke="#3cfcd1" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <!-- wordmark -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" filter="url(#glow)">
    <text x="84" y="50" font-size="40" font-weight="800" fill="#ff2fd5" letter-spacing="-1">Pwn<tspan fill="#ffffff">GPT</tspan></text>
    <text x="86" y="72" font-size="13.5" font-weight="700" fill="#3cfcd1" letter-spacing="2">AGENT HUNGER GAMES</text>
  </g>
</svg>
